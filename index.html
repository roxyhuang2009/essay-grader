<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F6F6F2" />
  <title>作文批改室｜學測國寫・英文作文</title>
  <meta name="description" content="上傳作文照片，依學測標準批改：分數、評語、滿分改寫、筆記，還能和 AI 繼續討論。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230D0D0D'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>批</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 把 AI 回覆的 Markdown 轉成漂亮的格式 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body data-subject="zh">
  <header class="topbar">
    <button class="icon-btn only-mobile" data-action="toggle-sidebar" aria-label="作文列表">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a class="brand" href="#/zh">
      <span class="brand-mark">批</span>
      <span class="brand-name">作文批改室</span>
    </a>

    <nav class="nav" aria-label="科目">
      <a href="#/zh" data-subject-tab="zh">國文</a>
      <a href="#/en" data-subject-tab="en">英文</a>
      <a href="#/settings" data-nav="settings" class="hide-mobile">設定</a>
    </nav>

    <div class="topbar-right">
      <button class="plan-pill" data-action="open-plan" id="planPill">免費方案</button>
      <a class="icon-btn only-mobile" href="#/settings" aria-label="設定">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
      <button class="btn primary" data-action="new-essay"><span class="plus">＋</span><span class="hide-mobile">新增作文</span></button>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden>
    <span class="dot"></span>示範模式：尚未連接後端，批改結果是假資料。在 <code>js/config.js</code> 填好 Worker 網址就會真的批改。
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <b id="sidebarTitle">國文作文</b>
        <span class="count-pill" id="sidebarCount">0</span>
      </div>
      <label class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="searchInput" type="search" placeholder="搜尋作文…" />
      </label>
      <div class="essay-list" id="essayList"></div>
      <p class="sidebar-foot">作文存在這台裝置的瀏覽器裡。換裝置前，到「設定」下載備份。</p>
    </aside>
    <div class="sidebar-scrim" data-action="toggle-sidebar"></div>

    <main class="main" id="main"></main>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
